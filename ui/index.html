<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>选择任务 · 任务进度追踪</title>
<style>
/* ===== 基础 ===== */
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f4f5f9;color:#1a1d24;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef0f6;padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:#7c8494}
.small{font-size:12px}
h1{font-size:26px;line-height:1.25;margin:0}
h2{font-size:17px;margin:0}
/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid #e8eaf1}
.topbar-inner{max-width:1160px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand::before{content:"";width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#5b7cfa,#9b5bfa)}
.crumbs{display:flex;align-items:center;gap:4px;flex:1;font-size:12.5px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:2px 5px;color:#7c8494;cursor:pointer;border-radius:6px}
.crumb:hover{color:#3d4bff;background:#f2f3fb;text-decoration:underline}
.crumb:focus-visible{outline:2px solid #3d4bff;outline-offset:1px}
.crumb-sep{color:#c6cbd8}
.crumb-current{color:#1a1d24;font-weight:600;padding:2px 5px;cursor:default}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ===== 按钮 ===== */
.btn{
  appearance:none;border:1px solid #dde1ea;background:#fff;color:#293040;padding:7px 13px;border-radius:9px;
  cursor:pointer;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
}
.btn:hover{border-color:#c7cde0;box-shadow:0 2px 10px rgba(30,40,80,.06)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-primary{background:#3d4bff;border-color:#3d4bff;color:#fff}
.btn-primary:hover{background:#3240e8;border-color:#3240e8}
.btn-small{padding:4px 10px;font-size:12px;border-radius:7px}
.link-btn{background:none;border:0;padding:2px 4px;color:#5b6478;cursor:pointer;border-radius:6px;font-size:13px}
.link-btn:hover{color:#3d4bff;background:#f2f3fb}
/* ===== 页面容器 ===== */
.app{max-width:1160px;margin:0 auto;padding:28px 24px 64px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.page-head h1 .muted{font-weight:500;font-size:16px}
.lead{margin:6px 0 20px;color:#69718a;font-size:13.5px;max-width:760px}
.card{background:#fff;border:1px solid #e9ebf2;border-radius:16px;box-shadow:0 1px 2px rgba(20,26,50,.04)}
/* ===== 第 1 页 ===== */
.drop{padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  border-style:dashed;border-color:#d8dcea;background:linear-gradient(180deg,#fbfcff,#fff)}
.drop-badge{font-size:12px;letter-spacing:2px;font-weight:700;color:#8b93a6;border:1px solid #e2e6f0;border-radius:8px;padding:4px 10px}
.file-section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e9ebf2;border-radius:12px;padding:11px 14px}
.file-row.is-error{border-color:#f3d0d1;background:#fff8f8}
.file-main{flex:1;min-width:0}
.file-name{font-weight:700;font-size:15px;display:block}
.file-sub{display:block;font-size:12.5px;color:#7c8494;margin-top:1px;word-break:break-word}
.file-row.is-error .file-sub{color:#c93b3f}
.page-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.empty-state{padding:22px;text-align:center;color:#8b93a6;border:1px dashed #e2e6f2;border-radius:12px;background:#fafbfe}
/* ===== 第 2 页 组横条（一列一行） ===== */
.group-grid{display:flex;flex-direction:column;gap:12px}
.group-card{
  position:relative;background:#fff;border:1px solid #e9ebf2;border-left:4px solid var(--gc);
  border-radius:16px;padding:16px 20px;cursor:pointer;transition:.18s;
  box-shadow:0 1px 2px rgba(20,26,50,.04);width:100%;
  display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) minmax(240px,320px);
  align-items:center;gap:20px;min-height:0;
}
.group-card::after{content:"";position:absolute;inset:0;border-radius:15px;background:radial-gradient(80% 160% at 0% 50%,var(--gc-soft),transparent 62%);opacity:.6;pointer-events:none}
.group-card>*{position:relative;z-index:1}
.group-card:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(20,26,50,.08)}
.group-card:focus-visible{outline:2px solid var(--gc);outline-offset:2px}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.group-head>div{min-width:0}
.group-name{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--gc);line-height:1.12;overflow-wrap:anywhere}
.kind-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.kind-study{background:#eef1ff;color:#3d4bff}
.kind-fitness{background:#fff2dd;color:#b9700d}
.group-sub{font-size:12px;color:#8b93a6;margin-top:2px}
.topic-list{margin:0;display:flex;flex-wrap:wrap;gap:5px 6px;min-width:0;align-content:center}
.topic-item{font-size:12px;color:#8a91a1;background:#f6f7fb;border-radius:7px;padding:2px 7px;max-width:100%;display:inline-flex;flex-wrap:wrap;align-items:baseline;column-gap:4px;line-height:1.5}
.topic-item .ym{white-space:nowrap}
.topic-item b{color:#555e73;font-weight:600;margin-right:3px}
.card-progress{margin-top:0;min-width:0}
.stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;color:#69718a;margin-bottom:6px}
.stat-label{font-weight:700;color:#293040;font-size:13px}
.stat-nums{font-variant-numeric:tabular-nums;color:#69718a}
.bar{height:8px;background:#edeff5;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .25s ease}
.bar--empty{background:#f2f3f7}
.stat-foot{margin-top:7px;font-size:12.5px;color:#69718a;min-height:19px}
.predict{color:#3f4a63}
.predict::before{content:"◷ ";color:#9aa2b4}
/* ===== 第 3 页 月度 ===== */
.month-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 18px}
.chip{border:1px solid #e2e5ef;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:#5b6478}
.chip:hover{border-color:#c7cde0}
.chip.is-active{background:#1a1d24;border-color:#1a1d24;color:#fff;font-weight:600}
.stat-panel{padding:16px 18px;display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
.stat-scope{grid-column:1/-1;font-size:12.5px;color:#8b93a6;margin-top:-4px}
.month-list{display:flex;flex-direction:column;gap:14px}
.month-card{padding:16px 18px;cursor:pointer;transition:.16s}
.month-card.is-complete{opacity:.62;background:#fbfcfe}
.month-card.is-complete:hover{opacity:.82}
.month-card:hover{box-shadow:0 10px 26px rgba(20,26,50,.08);border-color:#dfe3ee}
.month-card:focus-visible{outline:2px solid #3d4bff;outline-offset:2px}
.month-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.month-head h2{font-size:18px}
.month-done-tag{font-size:11px;font-weight:700;color:#7a8396;background:#eef0f5;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.chev{color:#9aa2b4;font-size:12.5px;white-space:nowrap;margin-top:2px}
.task-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.task-line{display:flex;align-items:center;gap:10px;padding:7px 2px;border-top:1px dashed #eff1f6;font-size:13px}
.task-line:first-child{border-top:1px solid #eff1f6}
.task-line .task-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-line.is-done .task-title{color:#8b93a6;text-decoration:line-through;text-decoration-color:#c3cad9}
.task-line.is-done .task-meta{opacity:.75}
.task-meta{color:#8b93a6;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.prio{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:1px 6px;border-radius:5px;line-height:1.6}
.prio--P0{background:#fdeaea;color:#c62828}
.prio--P1{background:#fff3e0;color:#b06a00}
.prio--P2{background:#eef0f6;color:#5c6577}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tag--fitness{background:#fff1d9;color:#a8640a}
.tag--study{background:#eef1ff;color:#4152c4}
/* ===== 第 4 页 周度 ===== */
.week-list{display:flex;flex-direction:column;gap:12px}
.week-card{overflow:hidden}
.week-head{
  display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:15px 18px;
  cursor:pointer;text-align:left;
}
.week-head:hover{background:#fbfcff}
.week-head:focus-visible{outline:2px solid #3d4bff;outline-offset:-2px}
.week-head-main{flex:1;min-width:0}
.week-title{display:block;font-weight:700;font-size:15px}
.week-sub{display:block;font-size:12.5px;margin-top:2px}
.week-progress{font-variant-numeric:tabular-nums;font-size:13px;color:#69718a;white-space:nowrap}
.week-progress b{color:#293040}
.chev-arrow{color:#9aa2b4;transition:transform .18s;font-size:12px;width:14px;text-align:center}
.week-card.is-open .chev-arrow{transform:rotate(180deg)}
.week-body{border-top:1px solid #f0f2f7;padding:6px 18px 16px}
.day-group{padding-top:10px}
.day-head{display:flex;align-items:baseline;gap:10px;font-size:12.5px;font-weight:700;color:#5b6478;padding:6px 0 8px}
.day-head .muted{font-weight:400}
.task-row{
  display:flex;align-items:flex-start;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;
  background:#fbfcff;border:1px solid #f0f2f7;border-left:3px solid #dbe2f0;margin-bottom:6px;
}
.task-row:hover{background:#f7f9ff}
.task-row--fitness{border-left-color:#e29a2c;background:#fffcf6}
.task-row--fitness:hover{background:#fff8ec}
.task-row input[type="checkbox"]{width:16px;height:16px;margin:2px 0 0;accent-color:#3d4bff;cursor:pointer;flex:none}
.task-row--fitness input[type="checkbox"]{accent-color:#d9901f}
.task-body{flex:1;min-width:0}
.task-row .task-title{display:block;font-size:13.5px;color:#232833;line-height:1.4}
.task-row.is-done .task-title{color:#8b93a6;text-decoration:line-through;text-decoration-color:#c3cad9}
.task-row.is-done{background:#f7f8fb;border-left-color:#c9d0dd}
.task-row.is-done .task-meta{color:#a5acba}
.task-row .task-meta{margin-top:3px;flex-wrap:wrap}
.task-time{font-size:11.5px;color:#8b93a6;white-space:nowrap;padding-top:2px}
.task-time.is-done{color:#2f8f5b}
.task-was{font-size:11px;color:#a0a7b8}
/* ===== 自动写盘状态 ===== */
.autosave{margin-top:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.autosave-main{flex:1;min-width:220px}
.autosave-title{font-weight:800;font-size:13px;color:#293040;margin-right:8px}
.autosave-status{font-size:12.5px;color:#69718a;word-break:break-word}
.autosave-status.is-error{color:#b3261e}
.autosave-note{font-size:12px;color:#8b93a6;margin-top:3px}
.autosave-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ===== 第 2 页 年度热力图 ===== */
.heat-card{padding:16px 18px;margin-bottom:16px}
.heat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.heat-title{font-weight:800;font-size:14px;color:#293040}
.heat-years{display:flex;gap:6px;flex-wrap:wrap}
.heat-year{border:1px solid #e2e5ef;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:#5b6478}
.heat-year.is-active{background:#1a1d24;border-color:#1a1d24;color:#fff;font-weight:700}
.heat-scroll{overflow-x:auto;padding-bottom:2px}
.heat-inner{min-width:max-content}
.heat-months{display:flex;gap:3px;margin-bottom:4px;height:14px;overflow:hidden}
.heat-month{font-size:10px;color:#7c8494;white-space:nowrap;overflow:hidden}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
.heat-cell{width:12px;height:12px;border-radius:3px;background:#ebedf0;border:0;padding:0;cursor:pointer;display:block}
.heat-cell:hover{outline:1px solid #9aa2b4}
.heat-cell.lv1{background:#9be9a8}
.heat-cell.lv2{background:#40c463}
.heat-cell.lv3{background:#216e39}
.heat-cell.is-out{opacity:0;pointer-events:none}
.heat-cell.is-active{outline:2px solid #1a1d24;outline-offset:1px}
.heat-foot{margin-top:10px;font-size:12.5px;color:#69718a;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.heat-tip{font-size:12px;color:#5b6478}
.heat-empty{margin-top:2px;font-size:12.5px;color:#8b93a6}
/* ===== 第 3 页 月历 ===== */
.month-cal{margin-bottom:18px;padding:14px 16px}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-title{font-weight:800;font-size:13.5px;color:#293040}
.cal-note{font-size:12px;color:#8b93a6}
.cal-scroll{overflow-x:auto}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:660px}
.cal-weekday{font-size:11px;font-weight:700;color:#9aa2b4;text-align:center;padding-bottom:2px}
.cal-cell{border:1px solid #edf0f6;border-radius:10px;min-height:86px;padding:5px 6px 6px;background:#fff;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cal-cell:hover{border-color:#cfd5e6;background:#fbfcff}
.cal-cell.is-empty{background:#fafbfd;border-style:dashed;color:#aab1bf;cursor:default;min-height:86px}
.cal-cell.is-empty:hover{background:#fafbfd;border-color:#edf0f6}
.cal-day{font-size:11px;font-weight:800;color:#5b6478;display:flex;justify-content:space-between;gap:4px}
.cal-day em{font-style:normal;font-weight:600;color:#9aa2b4}
.cal-task{font-size:10.5px;line-height:1.4;padding:1px 4px;border-radius:4px;border-left:3px solid #dbe2f0;background:#f6f7fb;color:#3f4759;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-task--P0{background:#fdeaea;border-left-color:#c62828;color:#8e1f1f;font-weight:700}
.cal-task--P1{background:#fff3e0;border-left-color:#d68a1e;color:#7d5200}
.cal-task--P2{background:#eef0f6;border-left-color:#98a2b6;color:#4f586b}
.cal-task--fitness{background:#e9f7ef;border-left-color:#2f8f5b;color:#24724a;font-weight:700}
.cal-task.is-done{background:#f3f4f8;border-left-color:#c7ccd8;color:#98a0b0;font-weight:400;text-decoration:line-through;text-decoration-color:#c3cad9}
.cal-min{margin-top:auto;font-size:10px;color:#9aa2b4}
.cal-detail{position:fixed;inset:0;background:rgba(15,20,35,.38);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.cal-modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:82vh;overflow:auto;padding:18px 20px;box-shadow:0 24px 60px rgba(10,15,30,.28)}
.cal-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.cal-modal h3{font-size:17px}
.cal-modal-sub{font-size:12.5px;color:#8b93a6;margin-top:2px}
.cal-day-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cal-day-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-top:1px dashed #eff1f6;font-size:13px}
.cal-day-row:first-child{border-top:1px solid #eff1f6}
.cal-day-row .task-title{flex:1;min-width:0}
.cal-day-row.is-done .task-title{color:#8b93a6;text-decoration:line-through;text-decoration-color:#c3cad9}
.cal-day-row .task-meta{color:#8b93a6;font-size:12px;display:flex;gap:8px;align-items:center}
/* ===== 第 2 页 当月全部科目月历 ===== */
.cal-cell--multi{min-height:96px}
.cal-nav{display:flex;gap:6px;align-items:center;margin-left:auto}
.cal-subj{display:flex;align-items:baseline;gap:4px;font-size:10.5px;line-height:1.4;padding:1px 5px;border-radius:4px;
  border-left:3px solid var(--sc);background:var(--sc-soft);color:#3f4759;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-subj i{width:5px;height:5px;border-radius:50%;background:var(--sc);flex:none;align-self:center}
.cal-subj b{font-weight:700;flex:none;max-width:4.6em;overflow:hidden;text-overflow:ellipsis}
.cal-subj.is-done{opacity:.55}
.cal-subj--tag{font-size:11px;padding:1px 7px;align-items:center}
.cal-more{font-size:10px;color:#9aa2b4;padding-left:2px}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:#69718a}
.cal-legend-item{display:inline-flex;align-items:center;gap:5px}
.cal-legend-dot{width:8px;height:8px;border-radius:3px;flex:none}
/* ===== 提示条 ===== */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;pointer-events:none;
  background:#1f2430;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 10px 30px rgba(10,15,30,.25);transition:.2s;z-index:50;max-width:80vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast--error{background:#b3261e}
@media (max-width:720px){
  .app{padding:20px 16px 52px}
  .topbar-inner{padding:10px 16px}
  .stat-panel{grid-template-columns:1fr;gap:14px}
  .group-grid{gap:10px}
  .group-card{grid-template-columns:1fr;gap:10px;padding:14px 16px}
  .group-name{font-size:24px}
  .topic-list{justify-content:flex-start}
  .task-line{flex-wrap:wrap}
  .task-line .task-title{white-space:normal}
  .page-actions{flex-direction:column-reverse}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">任务进度追踪</div>
    <nav class="crumbs" id="crumbs" aria-label="面包屑导航"></nav>
    <div class="top-actions">
      <button class="btn" id="btnDataDir" type="button" title="设置应用自身的会话/配置目录">数据目录</button>
      <button class="btn" id="btnExport" type="button">导出</button>
      <label class="btn" for="importInput">导入进度</label>
      <button class="btn" id="btnReselect" type="button">重新选择</button>
    </div>
  </div>
</header>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div style="padding:24px">本页面需要启用 JavaScript 才能使用。</div></noscript>
<input id="fileInput" type="file" accept=".json,application/json" multiple hidden />
<input id="importInput" type="file" accept=".json,application/json" hidden />
<script src="app.js"></script>
</body>
</html>
